name: Quality

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static checks
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup
        uses: $/.github/actions/setup

      - name: Run checks
        run: |
          pnpm exec turbo run check-formatting lint typecheck
          pnpm check-monorepo

  quality-checks:
    name: Quality checks
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup
        uses: $/.github/actions/setup
        with:
          node-version: ${{ matrix.node }}

      - name: Run tests
        run: |
          pnpm exec turbo run test

      - name: Try building
        run: pnpm exec turbo run build
