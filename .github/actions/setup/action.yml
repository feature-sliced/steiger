name: 'Setup and install'
description: 'Common setup steps for Actions'
inputs:
  node-version:
    description: 'Version of Node.js'
    required: true
    default: '22'
  save-cache:
    description: 'Whether to save the pnpm store cache at the end of the job'
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
      with:
        runtime: node@${{ inputs.node-version }}
        cache: true
        save-cache: ${{ inputs.save-cache }}
